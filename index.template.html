<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>anios</title>
  <!-- INJECT_CSS -->
</head>
<body>
  <!-- 宿主工具（演示脚手架，不属于系统 UI） -->
  <div class="host-tools">
    <div class="seg" role="group" aria-label="视口">
      <button type="button" data-size="compact">紧凑</button>
      <button type="button" data-size="large" aria-pressed="true">大型</button>
    </div>
    <div class="seg" role="group" aria-label="屏幕">
      <button type="button" data-screen="touch">触控</button>
      <button type="button" data-screen="pointer" aria-pressed="true">指针</button>
      <button type="button" data-screen="spatial">空间</button>
    </div>
    <div class="seg" role="group" aria-label="色彩">
      <button type="button" data-theme="light" aria-pressed="true">浅色</button>
      <button type="button" data-theme="dark">深色</button>
    </div>
  </div>

  <!-- 屏幕（视口）：系统层 / 窗口组由 src/render.ts 构造器装配 -->
  <div class="viewport-wrap">
    <div class="viewport" id="viewport" data-size="large" data-screen="pointer">
      <div class="wallpaper"></div>
      <button type="button" class="vp-resize" id="vpResize" aria-label="调整视口"></button>
    </div>
  </div>

  <!-- INJECT_JS -->
</body>
</html>
